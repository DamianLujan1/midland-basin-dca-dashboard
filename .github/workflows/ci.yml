name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  outputs:
    name: Committed outputs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Keep the committed results/ and public/, then clear them
        # Cleared so an output the build no longer writes shows up as missing.
        run: |
          mkdir "$RUNNER_TEMP/committed" && cp -r results public "$RUNNER_TEMP/committed/"
          rm -rf results public
      - name: Rebuild them (pipeline + static page)
        run: python scripts/build_static.py
      - name: Compare
        run: python scripts/check_outputs.py "$RUNNER_TEMP/committed" .
      - name: Keep this runner's rebuild if they differ
        # A value within CPU noise of a rounding boundary or the economic limit
        # can come out differently here than on the machine that built the
        # commit; committing these files settles it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-outputs
          path: |
            results/
            public/
